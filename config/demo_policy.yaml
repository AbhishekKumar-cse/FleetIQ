version: failure-review-policy-v1
probability_display_enabled: false
automatic_release_enabled: false
health:
  version: support-health-v1
  score_formula: 100_times_one_minus_calibrated_horizon_risk
  aggregation: minimum_eligible_critical_component
  watch_risk: 0.3
  critical_risk: 0.8
  maximum_age_hours: 6
  thresholds_scope: fictional_demo_rules_not_operational_validation
  missing_essential_action: unknown_null_score
  mutates_serviceability: false
anomaly:
  selection_role: tune_only
  consecutive_candidates: [2, 3]
  cooldown_hours_candidates: [6, 12]
  maximum_false_alerts_per_1000_normal_hours: 5
  quality_fault_action: abstain_and_reset_pending_evidence
  alert_meaning: engineering_review_not_diagnosis
review_threshold_role: frozen_tune_only_raw_score
false_alert_budget_per_1000_native_cycles: 5
decision_cost_unit: illustrative_inspection_equivalents
cost_sensitivity:
  - {missed_event: 1, false_review: 1}
  - {missed_event: 5, false_review: 1}
  - {missed_event: 20, false_review: 1}
