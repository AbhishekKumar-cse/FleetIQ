version: eligibility-v1
splits: config/splits.yaml
sources:
  benchmark: data/processed/cmapss/train.parquet
  synthetic: data/synthetic/observed
targets: config/targets.json
tasks:
  failure_risk:
    minimum_fit_engines: 20
    minimum_calibration_events: 20
    minimum_calibration_positive_engines: 20
    minimum_calibration_negative_engines: 20
    probability_deployment_enabled: false
    metrics: [average_precision, brier_score, calibration_curve, event_recall, false_alerts_per_1000_exposure]
    selection: tune_only_event_recall_at_most_5_false_alerts_per_1000_native_exposure
    calibrator_fit: calibration_only_after_hyperparameters_frozen
  rul:
    minimum_fit_engines: 20
    minimum_calibration_engines: 20
    metrics: [mae_native_cycles, rmse_native_cycles, interval_coverage, interval_width]
    selection: tune_only_mae_then_interval_coverage_0.90
  anomaly:
    minimum_fit_engines: 10
    metrics: [false_alerts_per_1000_exposure, detection_delay_native_unit]
    selection: training_reference_then_tune_only_false_alert_budget
roles:
  fit: preprocessing_and_estimator_fit
  tune: hyperparameters_and_operating_threshold_selection
  calibration: calibration_and_interval_fit_after_selection_freeze
  final_future: inventory_only_outcomes_inaccessible_to_selection
  nasa_official_test: evaluator_only_not_opened
synthetic_rul: unsupported_censoring_and_intervention
synthetic_hour_training:
  version: synthetic-hours-experiment-v1
  track: synthetic_sensor_model
  horizon_hours: 24
  life_unit: operating_hours
  hours: 240
  minimum_hour: 12
  stride_hours: 6
  xgboost_depths: [3, 5]
  healthy_seed_offset: 900000
  false_alert_budget_per_1000_hours: 5
  probability_display_enabled: false
  interval_display_enabled: false
  roles:
    fit: {engines: 96, seed_offset: 100000, installed_at: '2026-01-01T00:00:00+00:00'}
    tune: {engines: 48, seed_offset: 200000, installed_at: '2026-03-01T00:00:00+00:00'}
    calibration: {engines: 64, seed_offset: 300000, installed_at: '2026-06-01T00:00:00+00:00'}
    test: {engines: 64, seed_offset: 400000, installed_at: '2026-08-01T00:00:00+00:00'}
rul_training:
  version: native-cycle-rul-v1
  subset: FD001
  target: terminal_cycle_minus_observed_cycle
  life_unit: cycles
  early_life_cap: null
  minimum_cycle: 30
  anchors: every_10_observed_cycles_from_30_excluding_terminal
  ridge_alphas: [1.0, 10.0, 100.0]
  engine_weighting: equal_engine_weight_within_role
  display_policy: nonnegative_prediction_raw_metrics_retained
  xgboost: {depths: [3, 5], iterations: [150, 300], learning_rate: 0.05}
  minimum_complex_model_mae_gain_cycles: 1.0
  intervals: {alpha: 0.1, aggregation: maximum_absolute_residual_per_engine}
anomaly_training:
  version: synthetic-normal-residual-v1
  healthy_definition: controlled_zero_damage_no_quality_fault_fixture
  fit_engines: 24
  tune_engines_per_class: 12
  evaluation_engines_per_class: 12
  hours: 48
  rolling_window: 5
  n_estimators: 100
  max_samples: 256
  false_alert_budget_per_1000_windows: 5
  score_semantics: training_normal_empirical_percentile_not_probability
  seed_offsets: {fit: 0, tune: 10000, evaluation: 20000}
synthetic_history_minimum: 3
benchmark_history_minimum: 30
training:
  seed: 26249
  threads: 2
  class_weight: balanced
  logistic: {C: 1.0, max_iter: 2000, tol: 0.00001}
  random_forest: {n_estimators: 64, max_depth: 6, min_samples_leaf: 10, max_features: sqrt}
  xgboost:
    n_estimators: 180
    early_stopping_rounds: 20
    max_depth: [3, 5]
    learning_rate: [0.05, 0.10]
  selection:
    role: tune_only
    minimum_complex_model_ap_gain: 0.005
    primary: xgboost_subject_to_measured_gain
evaluation:
  tune_anchor: native_cycles_from_30_every_10_excluding_terminal
  minimum_cycle: 30
  stride_cycles: 10
  false_alert_budget_per_1000_cycles: 5
  bootstrap_engines: 100
  final_anchor: official_last_observed_cycle_only
  horizon_cycles: 30
