[project]
name = "fleetiq"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "cryptography>=50.0.2",
    "fastapi>=0.142.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "psycopg[binary]>=3.3.6",
    "pwdlib[argon2]>=0.3.1",
    "pyarrow>=25.0.1",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.15.1",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.1.3",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
fleetiq-migrate = "fleetiq_domain.migrations:main"

[tool.hatch.build.targets.wheel]
packages = [
    "apps/api/fleetiq_api",
    "services/worker/fleetiq_worker",
    "services/ml-inference/fleetiq_inference",
    "packages/domain/fleetiq_domain",
    "packages/data/fleetiq_data",
    "packages/features/fleetiq_features",
    "packages/scheduling/fleetiq_scheduling",
    "packages/simulation/fleetiq_simulation",
    "ml/training/fleetiq_training",
    "ml/evaluation/fleetiq_evaluation",
    "ml/registry/fleetiq_registry",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "unit: isolated unit tests",
    "integration: isolated service tests",
    "ml: leakage and model tests",
    "e2e: full-system tests",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["docs", "data", "artifacts", ".scratch", ".tools"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
